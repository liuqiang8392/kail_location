name: Android Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ====== 自动修复 KSP 版本和仓库配置 ======
      - name: Auto-fix KSP configuration
        run: |
          # 1. 修正 KSP 版本为正确的 2.2.0-2.0.2
          if [ -f "build.gradle.kts" ]; then
            sed -i 's/version "2\.2\.0-1\.0\.20"/version "2.2.0-2.0.2"/g' build.gradle.kts
            echo "✅ KSP version fixed to 2.2.0-2.0.2"
          fi

          # 2. 在 settings.gradle.kts 中确保包含 mavenCentral()
          if [ -f "settings.gradle.kts" ]; then
            # 检查是否已有 mavenCentral()
            if ! grep -q 'mavenCentral()' settings.gradle.kts; then
              # 在 pluginManagement 的 repositories 块中添加 mavenCentral()
              sed -i '/pluginManagement {/,/}/ {
                /repositories {/,/}/ {
                  /google()/a\        mavenCentral()
                }
              }' settings.gradle.kts
              echo "✅ Added mavenCentral() to settings.gradle.kts"
            else
              echo "✅ mavenCentral() already exists in settings.gradle.kts"
            fi
          fi

          # 3. 如果 settings.gradle.kts 不存在，尝试在 build.gradle.kts 的 pluginManagement 中添加
          if [ ! -f "settings.gradle.kts" ] && [ -f "build.gradle.kts" ]; then
            if ! grep -q 'mavenCentral()' build.gradle.kts; then
              sed -i '/pluginManagement {/,/}/ {
                /repositories {/,/}/ {
                  /google()/a\        mavenCentral()
                }
              }' build.gradle.kts
              echo "✅ Added mavenCentral() to build.gradle.kts"
            fi
          fi
        shell: bash

      - name: Cache Gradle packages
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
