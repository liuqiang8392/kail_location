name: Android Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ====== 创建 init.gradle：仅覆盖 pluginManagement 仓库 ======
      - name: Create init.gradle
        run: |
          cat > init.gradle << 'EOF'
          settingsEvaluated { settings ->
              // 完全替换 pluginManagement 的仓库列表，确保 mavenCentral 在最前面
              settings.pluginManagement {
                  repositories {
                      mavenCentral()
                      gradlePluginPortal()
                      google()
                      // 如果你需要保留阿里云镜像，可以添加，但 KSP 不在此，所以非必须
                      // maven { url = "https://maven.aliyun.com/repository/central" }
                      // maven { url = "https://maven.aliyun.com/repository/google" }
                  }
              }
          }
          EOF
          echo "✅ init.gradle created"

      - name: Cache Gradle packages
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew --init-script init.gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
