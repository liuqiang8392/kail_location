name: Android Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ====== 创建 init.gradle，覆盖所有仓库配置 ======
      - name: Create init.gradle to override repositories
        run: |
          cat > init.gradle << 'EOF'
          settingsEvaluated { settings ->
              // 1. 覆盖 pluginManagement 仓库（用于插件解析）
              settings.pluginManagement {
                  repositories.clear()
                  repositories {
                      mavenCentral()
                      google()
                      gradlePluginPortal()
                      maven { url = "https://www.jitpack.io" }
                  }
              }

              // 2. 覆盖 dependencyResolutionManagement 仓库（用于依赖解析）
              settings.dependencyResolutionManagement {
                  repositories.clear()
                  repositories {
                      mavenCentral()
                      google()
                      maven { url = "https://www.jitpack.io" }
                  }
              }
          }
          EOF
          echo "✅ init.gradle created"

      - name: Cache Gradle packages
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew --init-script init.gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
