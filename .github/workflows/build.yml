name: Android Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ====== 自动修正 KSP 版本（将无效的 2.2.0-2.0.2 改为可用的 2.2.0-1.0.20） ======
      - name: Auto-fix KSP version
        run: |
          # 修正根目录 build.gradle.kts 中的 KSP 版本
          if [ -f "build.gradle.kts" ]; then
            sed -i 's/version "2\.2\.0-2\.0\.2"/version "2.2.0-1.0.20"/g' build.gradle.kts
            echo "✅ Root build.gradle.kts fixed"
          fi

          # 修正 app/build.gradle.kts（如果存在类似声明）
          if [ -f "app/build.gradle.kts" ]; then
            sed -i 's/version "2\.2\.0-2\.0\.2"/version "2.2.0-1.0.20"/g' app/build.gradle.kts
            echo "✅ app/build.gradle.kts fixed"
          fi

          # 修正 gradle/libs.versions.toml（如果存在）
          if [ -f "gradle/libs.versions.toml" ]; then
            sed -i 's/ksp = "2\.2\.0-2\.0\.2"/ksp = "2.2.0-1.0.20"/g' gradle/libs.versions.toml
            echo "✅ gradle/libs.versions.toml fixed"
          fi

          # 检查是否还有未替换的残留（可选）
          echo "🔍 Checking if any '2.2.0-2.0.2' remains..."
          grep -r "2\.2\.0-2\.0\.2" . --include="*.gradle.kts" --include="*.toml" || echo "✅ No remaining invalid version found."
        shell: bash

      - name: Cache Gradle packages
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
