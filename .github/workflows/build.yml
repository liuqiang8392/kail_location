name: Android Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 【新增】自动修正 KSP 版本（将错误版本替换为有效版本）
      - name: Fix KSP version in build.gradle.kts
        run: |
          # 如果根目录是 build.gradle.kts，直接替换
          if [ -f "build.gradle.kts" ]; then
            sed -i 's/version "2\.2\.0-2\.0\.2"/version "2.0.2-1.0.20"/g' build.gradle.kts
          fi
          # 如果版本定义在 libs.versions.toml 中，也可替换（根据实际情况调整）
          if [ -f "gradle/libs.versions.toml" ]; then
            sed -i 's/ksp = "2\.2\.0-2\.0\.2"/ksp = "2.0.2-1.0.20"/g' gradle/libs.versions.toml
          fi
        # 注意：替换的版本号请根据你的 Kotlin 版本选择正确的 KSP 版本

      - name: Cache Gradle packages
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
