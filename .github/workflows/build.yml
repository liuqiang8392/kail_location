name: Android Build

on:
  # 当 push 到 main/master 分支时触发
  push:
    branches: [ main, master ]
  # 当提交 Pull Request 到 main/master 分支时触发
  pull_request:
    branches: [ main, master ]
  # 允许手动触发（在 GitHub Actions 页面点击按钮）
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. 检出代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. 设置 JDK 17（Android Gradle 插件要求）
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. 设置 Android SDK（自动安装并接受许可证）
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 4. 缓存 Gradle 依赖，加速后续构建
      - name: Cache Gradle packages
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # 5. 给 gradlew 添加执行权限
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 6. 构建 Debug APK（你也可以改为 assembleRelease，但需要签名配置）
      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug

      # 7. 上传生成的 APK 作为 Artifact
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
