name: Android Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ====== 创建 init.gradle 以注入 mavenCentral() 仓库 ======
      - name: Create init.gradle to add mavenCentral()
        run: |
          cat > init.gradle << 'EOF'
          settingsEvaluated { settings ->
              settings.pluginManagement {
                  repositories {
                      mavenCentral()
                      gradlePluginPortal()
                      google()
                      // 保留可能已存在的阿里云等，但不冲突
                  }
              }
          }
          // 同时为所有项目添加仓库（可选）
          allprojects {
              buildscript {
                  repositories {
                      mavenCentral()
                      google()
                  }
              }
              repositories {
                  mavenCentral()
                  google()
              }
          }
          EOF
          echo "✅ init.gradle created"

      - name: Cache Gradle packages
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew --init-script init.gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
