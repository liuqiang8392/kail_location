name: Android Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ====== 自动修复 KSP 版本（不修改源码仓库） ======
      - name: Auto-fix KSP version
        run: |
          # 在根目录 build.gradle.kts 中，将已有的错误版本替换为正确版本
          if [ -f "build.gradle.kts" ]; then
            sed -i 's/version "2\.0\.2-1\.0\.20"/version "2.2.0-2.0.2"/g' build.gradle.kts
            # 如果插件声明没有版本，则添加版本号
            if grep -q 'id("com.google.devtools.ksp")' build.gradle.kts && ! grep -q 'id("com.google.devtools.ksp").*version' build.gradle.kts; then
              sed -i 's/id("com.google.devtools.ksp")/id("com.google.devtools.ksp") version "2.2.0-2.0.2"/g' build.gradle.kts
            fi
          fi

          # 同样处理 app/build.gradle.kts（如果存在）
          if [ -f "app/build.gradle.kts" ]; then
            sed -i 's/version "2\.0\.2-1\.0\.20"/version "2.2.0-2.0.2"/g' app/build.gradle.kts
            if grep -q 'id("com.google.devtools.ksp")' app/build.gradle.kts && ! grep -q 'id("com.google.devtools.ksp").*version' app/build.gradle.kts; then
              sed -i 's/id("com.google.devtools.ksp")/id("com.google.devtools.ksp") version "2.2.0-2.0.2"/g' app/build.gradle.kts
            fi
          fi

          # 如果版本定义在 gradle/libs.versions.toml 中，也进行替换
          if [ -f "gradle/libs.versions.toml" ]; then
            sed -i 's/ksp = "2\.0\.2-1\.0\.20"/ksp = "2.2.0-2.0.2"/g' gradle/libs.versions.toml
            # 如果 toml 中没有定义 ksp，则添加（但这里不额外添加，以免破坏结构）
          fi

          echo "KSP version has been fixed to 2.2.0-2.0.2"
        shell: bash

      - name: Cache Gradle packages
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
